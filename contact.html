<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 (Contact Us) | 다계산</title>
  <meta name="description" content="다계산 서비스에 대한 계산 오류 제보, 새로운 도구 추가 제안, 광고 및 제휴 문의를 남겨주세요.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20">
          <i data-lucide="calculator" class="w-5 h-5"></i>
        </div>
        <span class="text-xl font-extrabold text-slate-900 tracking-tight">다계산</span>
      </a>
      <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600">← 계산기 홈으로 돌아가기</a>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-sm">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-full mb-3">
        <span>CONTACT US</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">
        문의 및 의견 제안
      </h1>
      <p class="text-slate-600 text-sm mb-8 leading-relaxed">
        계산식 오류 제보, 새로운 계산기 기능 제안, 제휴 문의 등 다양한 의견을 환영합니다. 남겨주신 소중한 메시지는 면밀히 검토하여 서비스에 적극 반영하겠습니다.
      </p>

      <form id="contactForm" class="space-y-5" onsubmit="handleContactSubmit(event)">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
            이름 / 닉네임
          </label>
          <input 
            type="text" 
            required 
            placeholder="홍길동" 
            class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-300 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
            회신받을 이메일 주소
          </label>
          <input 
            type="email" 
            required 
            placeholder="example@domain.com" 
            class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-300 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
            문의 유형
          </label>
          <select class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-300 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500">
            <option>계산 공식 / 데이터 오류 제보</option>
            <option>새로운 도구 / 기능 추가 요청</option>
            <option>비즈니스 제휴 및 광고 문의</option>
            <option>기타 일반 의견</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
            문의 내용
          </label>
          <textarea 
            rows="6" 
            required 
            placeholder="상세한 내용이나 참고 링크를 적어주시면 빠른 처리에 도움이 됩니다..." 
            class="w-full p-4 bg-slate-50 rounded-xl border border-slate-300 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 leading-relaxed"
          ></textarea>
        </div>

        <button 
          type="submit" 
          class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-blue-500/20"
        >
          메시지 전송하기
        </button>
      </form>

      <div class="mt-8 pt-8 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs text-slate-500">
        <div class="flex items-center gap-2">
          <i data-lucide="mail" class="w-4 h-4 text-blue-600"></i>
          <span>직접 이메일 문의: support@allcalc.kr</span>
        </div>
        <div class="flex items-center gap-2">
          <i data-lucide="clock" class="w-4 h-4 text-emerald-600"></i>
          <span>영업일 기준 24~48시간 이내 회신</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center text-xs text-slate-500">
      <p>© 2026 다계산. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script>
    lucide.createIcons();

    function handleContactSubmit(e) {
      e.preventDefault();
      showToast('문의가 성공적으로 접수되었습니다. 검토 후 신속히 답변드리겠습니다.');
      document.getElementById('contactForm').reset();
    }
  </script>
</body>
</html>
